name: Release
on:
    push:
        tags: ['v*']
permissions:
    contents: read
jobs:
    ci:
        uses: ./.github/workflows/ci.yml
    package:
        needs: ci
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup
            - name: Validate tag and manifest versions
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
              run: node scripts/check-release.mjs
            - run: pnpm package
            - name: Add checksum
              run: cd dist && sha256sum majorpodo.tar.gz > majorpodo.tar.gz.sha256
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: deployment-release
                  path: |
                      dist/majorpodo.tar.gz
                      dist/majorpodo.tar.gz.sha256
                  retention-days: 7
                  if-no-files-found: error
    publish:
        needs: package
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: deployment-release
                  path: dist
            - name: Publish GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  gh release create "$RELEASE_TAG" dist/majorpodo.tar.gz dist/majorpodo.tar.gz.sha256 \
                    --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --generate-notes
