# Example for /etc/nginx/sites-enabled/majorpodo.example.com.
# Replace majorpodo.example.com throughout with your own domain.
# Certificate and htpasswd files are managed on the host, outside this repository.
server {
        listen 443 ssl; # managed by Certbot
        root /var/www/majorpodo.example.com/;
        index index.html index.htm index.nginx-debian.html;
        server_name majorpodo.example.com;
        location ^~ /.well-known/ {
                  auth_basic off;
                  try_files $uri $uri/ /index.html;
        }
        # Protect both the slashless entry point and every admin subpage.
        # Only nominated accounts belong in htpasswd-admin.
        location = /_admin {
                auth_basic           "Majorpodo";
                auth_basic_user_file /etc/majorpodo/htpasswd-admin;
                proxy_pass           http://127.0.0.1:3000;
        }
        location ^~ /_admin/ {
                auth_basic           "Majorpodo";
                auth_basic_user_file /etc/majorpodo/htpasswd-admin;
                proxy_pass           http://127.0.0.1:3000;
        }
        location / {
                auth_basic           "Majorpodo";
                auth_basic_user_file /etc/majorpodo/htpasswd;
                try_files $uri @proxy;
        }
        location @proxy {
                proxy_pass           http://127.0.0.1:3000;
        }
    ssl_certificate /etc/letsencrypt/live/majorpodo.example.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/majorpodo.example.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
